# Plugin CI: deterministic checks on every PR. Behavioural evals run on demand (make evals) because they need a model.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install linters and Claude Code
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          pip install -q ruff
          npm install -g @anthropic-ai/claude-code
      - name: make check
        run: make check
      - name: Validate plugin manifest
        run: claude plugin validate .

  aiops-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit this repo's own gates
        run: python3 bin/sdlc validate --all --ci
