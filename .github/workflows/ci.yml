# Plugin CI: deterministic checks on every PR. Behavioural evals run on demand (make evals) because they need a model.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install linters and Claude Code (pinned)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          pip install -q ruff==0.6.9
          npm install -g @anthropic-ai/claude-code@2.1.314
      - name: make check
        run: make check
      - name: Validate plugin manifest
        run: claude plugin validate .

  aiops-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit this repo's gates with the base branch's engine
        # A PR must not be able to weaken the audit that judges it: the engine, signer list and legacy list all come
        # from the target branch.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git rev-parse -q --verify "${BASE_SHA}^{commit}" >/dev/null; then
            echo "::error::base commit '${BASE_SHA}' does not resolve; refusing to audit against the change itself"
            exit 1
          fi
          git worktree add -q "$RUNNER_TEMP/base" "$BASE_SHA"
          if grep -q -- '--base' "$RUNNER_TEMP/base/lib/sdlc_engine/cli.py"; then
            python3 "$RUNNER_TEMP/base/bin/sdlc" validate --all --ci --base "$BASE_SHA"
          else   # engines before v0.2.0 have no --base and audit with their own (older) rules
            python3 "$RUNNER_TEMP/base/bin/sdlc" validate --all --ci
          fi
