# Control bands for the Maintain stage.
# Detection is deterministic: scripts/check-bands.py compares each metric's current value against a
# rolling baseline (mean ± σ over the last `window` samples). Claude is only invoked by the band action.
#
#   band 1 (≥1σ) → log the event
#   band 2 (≥2σ) → read-only diagnosis (diagnostician agent → draft intent.md)
#   band 3 (≥3σ) → diagnosis + propose a fix PR, or trigger the metric's pre-approved runbook
#
# `query` is any shell command that prints ONE number (curl your metrics API, promtool, a SQL query...).
# Baselines are kept in ops/.history/<metric>.jsonl. In production, point queries at your monitoring
# system and persist the history (CI cache or artifact store).

defaults:
  window: 28          # samples in the rolling baseline
  min_samples: 7      # below this, only log (not enough baseline)

metrics:
  - name: api_error_rate
    description: 5xx ratio over the last 5 minutes
    query: "echo 0.010"                 # TODO: replace with your metrics query
    direction: up                       # up | down | both: which deviation is bad
    owner: "@your-org/maintainers"
    runbook: rollback                   # pre-approved band-3 runbook (see .github/workflows/deploy.yml)

  - name: api_p95_latency_ms
    description: p95 request latency
    query: "echo 180"
    direction: up
    owner: "@your-org/maintainers"
    runbook: null                       # band 3 → propose a PR only

  - name: signup_conversion
    description: signups / visits, daily
    query: "echo 0.042"
    direction: down
    owner: "@your-org/product"
    runbook: null
