# Interactive Claude: mention @claude in an issue, PR comment, or review.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Load zouj-ai-sdlc (agents, skills, guards) in CI. Check the input names against the claude-code-action docs.
          plugin_marketplaces: https://github.com/zoujagger/zouj-ai-sdlc.git
          plugins: zouj-ai-sdlc@zouj
          # Claude reads CLAUDE.md, .aiops/ and the zouj-ai-sdlc plugin (agents, skills, guards).
          claude_args: |
            --allowedTools "Bash(make *),Bash(git status*),Bash(git diff*),Bash(git log*),Bash(gh pr view *),Bash(gh pr diff *),Bash(gh issue view *),Read,Edit,Write,Grep,Glob"
