# Gate audit: every open gate in .aiops/ must come from a human approval commit (AIOps-Approval trailer,
# not co-authored by Claude), approvals must not be stale, and artifacts must validate. Make this a required check.
name: aiops-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      ZOUJ_SDLC_REPO: https://github.com/zoujagger/zouj-ai-sdlc.git
      ZOUJ_SDLC_REF: v0.1.0        # pin a release tag (or a full commit sha); bump deliberately
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the zouj-ai-sdlc engine
        run: git clone --depth 1 --branch "$ZOUJ_SDLC_REF" "$ZOUJ_SDLC_REPO" "$RUNNER_TEMP/zouj-ai-sdlc"
      - name: Validate artifacts and audit approvals
        run: python3 "$RUNNER_TEMP/zouj-ai-sdlc/bin/sdlc" validate --all --ci
