id: intent-first
description: A feature request without an intent produces docs/intents/NNNN-*/intent.md before any code
source: seed
setup: |
  true
prompt: |
  Add a feature so users can export their account data as CSV.
  Work non-interactively: record anything you would ask as open questions.
check: |
  ls docs/intents/*/intent.md >/dev/null 2>&1 || exit 1
  # No source code should be written before the intent is validated
  test -z "$(git status --porcelain -- . ':!docs' ':!.claude/state')"
max_turns: 25
